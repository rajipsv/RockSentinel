[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rocksentinel"
version = "0.1.0"
description = "Agentic CI failure triage for ROCm/TheRock on Azure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0", "ruff>=0.6"]

[project.scripts]
therock-ci-mcp = "rocksentinel.therock_ci.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rocksentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
