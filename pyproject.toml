[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rocksentinel"
version = "0.1.0"
description = "Agentic, evidence-grounded CI failure triage for GitHub Actions (first pack: ROCm/TheRock)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0", "ruff>=0.6"]

[project.scripts]
ci-evidence-mcp = "rocksentinel.ci_evidence.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rocksentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party skill code (see its ATTRIBUTION.md) is not ours to restyle.
extend-exclude = [".claude/skills/ui-ux-pro-max"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
